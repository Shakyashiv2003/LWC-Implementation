<template>
    <lightning-card title="Character Counter using LWC"> 
        <lightning-input 
            label="Type something" 
            maxlength="50"
            onchange={handleChange}
            class="slds-m-horizontal_medium">
        </lightning-input>

    <div class="slds-m-horizontal_medium" >
        <p>{count}/50</p>

    <lightning-button

        slot="actions"
        label="Submit" 
        disabled={isDisabled}
        variant="brand">
    </lightning-button>

    </lightning-card>
    
</template>
