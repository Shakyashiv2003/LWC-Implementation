<template>

    <!-- 🔹 Product List -->
    <h2 class="slds-text-heading_medium slds-m-around_small">  🛍 Product List   </h2>

    <template for:each={products} for:item='prod'>
        <c-product-item 
            key={prod.id}
            product={prod} 
            onaddtocart={handleAddToCart}>
        </c-product-item>
    </template>

    <!-- 🔹 Divider -->
    <hr class="slds-m-vertical_medium"/>

    <!-- 🔹 Cart Section -->
    <h2 class="slds-text-heading_medium slds-m-around_small">  🛒 Cart </h2>

    <template if:true={cart.length}>
        <template for:each={cart} for:item="item">
            <p key={item.id} class="slds-m-left_medium">
                {item.name} - ₹{item.price}
            </p>
        </template>

        <h3 class="slds-m-around_medium">
            Total: ₹{totalPrice}
        </h3>

    </template>

    <template if:false={cart.length}>
        <p class="slds-m-left_medium">Cart is empty</p>
    </template>

</template>
